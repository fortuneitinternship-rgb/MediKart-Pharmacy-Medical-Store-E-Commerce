# ==========================================================
# MediKart - everything in one command:
#
#     docker compose up --build
#
#   Website : http://localhost:3000
#   API docs: http://localhost:8000/docs
#   Admin   : admin@medikart.com / Admin@12345
#
# Database password is "root" (development only).
# ==========================================================
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medikart
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - medikart_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:root@db:3306/medikart
      SECRET_KEY: medikart-docker-dev-secret-key-change-me-1234567890
      APP_ENV: development
      PAYMENT_MODE: simulator
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIR: /app/uploads
    # Creates tables, loads products and the admin user (safe to repeat), then starts the API.
    command: ["sh", "-c", "python init_db.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - medikart_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  medikart_mysql_data:
  medikart_uploads:
